<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Crossword 3x3 Grid Motif in Center -->
  <g transform="translate(106, 106)" filter="url(#tileShadow)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="90" height="90" rx="16" fill="url(#tileGrad)" stroke="#cbd5e1" stroke-width="3" />
    <text x="45" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#0f172a" text-anchor="middle">C</text>

    <rect x="105" y="0" width="90" height="90" rx="16" fill="url(#accentGrad)" stroke="#38bdf8" stroke-width="3" />
    <text x="150" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#ffffff" text-anchor="middle">R</text>

    <rect x="210" y="0" width="90" height="90" rx="16" fill="url(#tileGrad)" stroke="#cbd5e1" stroke-width="3" />
    <text x="255" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#0f172a" text-anchor="middle">O</text>

    <!-- Row 2 -->
    <rect x="0" y="105" width="90" height="90" rx="16" fill="#334155" stroke="#475569" stroke-width="3" />
    
    <rect x="105" y="105" width="90" height="90" rx="16" fill="url(#tileGrad)" stroke="#cbd5e1" stroke-width="3" />
    <text x="150" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#0f172a" text-anchor="middle">S</text>

    <rect x="210" y="105" width="90" height="90" rx="16" fill="#334155" stroke="#475569" stroke-width="3" />

    <!-- Row 3 -->
    <rect x="0" y="210" width="90" height="90" rx="16" fill="url(#tileGrad)" stroke="#cbd5e1" stroke-width="3" />
    <text x="45" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#0f172a" text-anchor="middle">S</text>

    <rect x="105" y="210" width="90" height="90" rx="16" fill="url(#accentGrad)" stroke="#38bdf8" stroke-width="3" />
    <text x="150" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#ffffff" text-anchor="middle">W</text>

    <rect x="210" y="210" width="90" height="90" rx="16" fill="url(#tileGrad)" stroke="#cbd5e1" stroke-width="3" />
    <text x="255" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#0f172a" text-anchor="middle">D</text>
  </g>

  <!-- Small magnifying lens icon badge at bottom right -->
  <circle cx="400" cy="400" r="42" fill="#0284c7" stroke="#38bdf8" stroke-width="4" />
  <circle cx="394" cy="394" r="16" fill="none" stroke="#ffffff" stroke-width="5" />
  <line x1="406" y1="406" x2="424" y2="424" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
</svg>
